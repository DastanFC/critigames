<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CRITIFLIX - Comunidad de Cine y Videojuegos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor principal */
        .landing {
            text-align: center;
            padding: 20px;
            max-width: 800px;
            width: 100%;
        }

        /* Logo grande */
        .logo {
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 4rem;
            background: linear-gradient(135deg, #e50914, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -2px;
        }

        /* Subtítulo */
        .subtitle {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 50px;
            border-top: 1px solid #2a2a3a;
            border-bottom: 1px solid #2a2a3a;
            padding: 12px 0;
            display: inline-block;
        }

        /* Contenedor de botones */
        .botones {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        /* Estilo base de los botones */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.05);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Botón CINE (rojo, como tu web) */
        .btn-cine {
            background: #e50914;
            color: white;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .btn-cine:hover {
            background: #ff0a1a;
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.5);
        }

        /* Botón VIDEOJUEGOS (verde gaming) */
        .btn-juegos {
            background: #A855F7;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-juegos:hover {
            background: #9b4de3;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        /* Texto decorativo debajo */
        .footer-text {
            font-size: 0.8rem;
            color: #555;
            margin-top: 50px;
        }

        .footer-text a {
            color: #e50914;
            text-decoration: none;
        }

        /* Responsive para móvil */
        @media (max-width: 550px) {
            .logo h1 {
                font-size: 2.5rem;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 1.1rem;
                width: 200px;
                justify-content: center;
            }
            
            .subtitle {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="landing">
        <div class="logo">
            <h1>🎬🎮 CRITIFLIX</h1>
        </div>
        
        <div class="subtitle">
            Tu comunidad de críticas donde tu opinión es la real
        </div>
        
        <div class="botones">
            <a href="cine.html" class="btn btn-cine">
                🎬 CINE
            </a>
            <a href="cine.html?modo=juegos" class="btn btn-juegos">
                🎮 VIDEOJUEGOS
            </a>
        </div>
        
        <div class="footer-text">
            Sin publicidad · Sin afiliados · Solo opiniones reales
        </div>
    </div>
</body>
</html>
