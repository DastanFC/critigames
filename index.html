<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>PlayerCore — Reviews reales de jugadores</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --white: #ffffff;
  --off-white: #f7f7f5;
  --gray-100: #e8e8e4;
  --gray-200: #d0d0cc;
  --gray-500: #6b6b66;
  --gray-700: #3a3a36;
  --gray-900: #1a1a18;
  --green: #6ac46a;
  --green-dark: #4a8c4a;
  --yellow: #ffbe00;
  --red: #e84040;
  --border: #e0e0da;
}

body {
  background: var(--off-white);
  color: var(--gray-900);
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 15px;
  line-height: 1.5;
}

nav {
  background: var(--gray-900);
  padding: 0 1rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  min-height: 50px;
  flex-wrap: wrap;
}
.nav-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  color: white;
  text-decoration: none;
}
.nav-logo span { color: var(--green); }
.nav-search {
  flex: 1;
  display: flex;
  max-width: 300px;
}
.nav-search input {
  flex: 1;
  padding: 0.4rem 0.6rem;
  border: none;
  border-radius: 4px 0 0 4px;
  background: rgba(255,255,255,0.1);
  color: white;
}
.nav-search button {
  padding: 0.4rem 0.8rem;
  background: var(--green);
  border: none;
  border-radius: 0 4px 4px 0;
  cursor: pointer;
  font-weight: bold;
}
.nav-user {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.nav-user-info {
  color: white;
  font-size: 0.75rem;
  font-family: 'Barlow Condensed', sans-serif;
}
.nav-btn-login, .btn-logout {
  background: none;
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  padding: 0.2rem 0.8rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.75rem;
}
.sub-nav {
  background: white;
  border-bottom: 2px solid var(--border);
  padding: 0 1rem;
  display: flex;
  overflow-x: auto;
  gap: 0.5rem;
}
.sub-nav a {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--gray-500);
  text-decoration: none;
  padding: 0.6rem 0.8rem;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.sub-nav a:hover, .sub-nav a.active {
  color: var(--gray-900);
  border-bottom-color: var(--gray-900);
}
.page-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1rem;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 1rem 0;
}
.section-header h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
}
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}
.game-card {
  background: white;
  cursor: pointer;
  transition: all 0.15s;
}
.game-card:hover {
  box-shadow: inset 0 0 0 2px var(--gray-900);
}
.game-card-img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  background: var(--gray-100);
}
.game-card-body {
  padding: 0.6rem;
}
.game-card-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.game-card-meta {
  font-size: 0.7rem;
  color: var(--gray-500);
}
.game-card-footer {
  padding: 0.4rem 0.6rem;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.score {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 1.2rem;
  border-radius: 4px;
}
.score.green { background: var(--green); color: var(--gray-900); }
.score.yellow { background: var(--yellow); color: var(--gray-900); }
.score.red { background: var(--red); color: white; }
.score.na { background: var(--gray-100); color: var(--gray-500); }
.two-col {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 1.5rem;
}
.sidebar-card {
  background: white;
  border: 1px solid var(--border);
  margin-bottom: 1rem;
}
.sidebar-card-header {
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--border);
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
}
.sidebar-card-body {
  padding: 0.6rem 1rem;
}
.list-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.list-rank {
  font-weight: 800;
  width: 28px;
}
.list-title {
  flex: 1;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.modal {
  background: white;
  width: 100%;
  max-width: 750px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 8px;
}
.modal-top {
  background: var(--gray-900);
  padding: 0.8rem 1.2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
}
.modal-top h2 { color: white; font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; }
.modal-close {
  background: none; border: 1px solid rgba(255,255,255,0.3); color: white;
  width: 28px; height: 28px; cursor: pointer; border-radius: 4px;
}
.modal-game-info {
  display: flex; gap: 0.8rem; padding: 1rem;
  background: var(--gray-50); border-bottom: 1px solid var(--border);
  align-items: center;
}
.modal-game-img { width: 70px; height: 44px; object-fit: cover; background: var(--gray-100); }
.modal-game-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.1rem; }
.modal-body { padding: 1.2rem; }
.overall-box {
  background: var(--gray-900); color: white; padding: 1rem;
  display: flex; gap: 1rem; margin-bottom: 1.5rem; border-radius: 6px;
}
.overall-number { font-family: 'Barlow Condensed', sans-serif; font-size: 2.5rem; font-weight: 800; min-width: 70px; }
.overall-bar-wrap { flex: 1; }
.overall-bar { height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
.overall-bar-fill { height: 100%; border-radius: 4px; transition: width 0.2s; }
.slider-block { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
.slider-block-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 0.9rem; margin-bottom: 0.8rem; }
.slider-item { margin-bottom: 0.8rem; }
.slider-header { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 0.2rem; }
input[type="range"] { width: 100%; height: 5px; -webkit-appearance: none; background: var(--gray-200); border-radius: 3px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--gray-900); cursor: pointer; }
.slider-value { font-weight: 700; color: var(--green-dark); }
textarea, select {
  width: 100%; padding: 0.6rem; border: 1px solid var(--border);
  border-radius: 6px; font-family: inherit; font-size: 0.85rem;
  margin-bottom: 1rem; resize: vertical;
}
.submit-btn {
  width: 100%; background: var(--gray-900); color: white;
  border: none; padding: 0.8rem; font-weight: 800; cursor: pointer; border-radius: 6px;
}
.submit-btn:hover { background: var(--green-dark); }

#loginModal .modal { max-width: 380px; }
#loginModal input {
  width: 100%; padding: 0.7rem; margin-bottom: 0.8rem;
  border: 1px solid var(--border); border-radius: 6px; background: white;
  font-size: 0.9rem;
}
.switch-btn {
  width: 100%; background: none; border: 1px solid var(--border);
  padding: 0.6rem; margin-top: 0.5rem; cursor: pointer;
  font-weight: 600; border-radius: 6px;
}
.banner {
  background: var(--green-dark); color: white; text-align: center; padding: 0.5rem;
  font-size: 0.8rem; display: none;
}
.banner .close { float: right; background: none; border: none; color: white; cursor: pointer; margin-right: 1rem; }

@media (max-width: 700px) {
  .two-col { grid-template-columns: 1fr; }
  .games-grid { grid-template-columns: repeat(2, 1fr); }
  .nav-search { max-width: none; }
  nav { flex-direction: column; align-items: stretch; }
  .nav-logo { align-self: flex-start; }
}
</style>
</head>
<body>

<div class="banner" id="globalBanner"><button class="close" onclick="this.parentElement.style.display='none'">✕</button><span id="bannerMessage"></span></div>

<nav>
  <a class="nav-logo" href="#"><span>Player</span>Core</a>
  <div class="nav-search">
    <input type="text" id="searchInput" placeholder="Buscar juego..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">BUSCAR</button>
  </div>
  <div class="nav-user" id="navUser">
    <button class="nav-btn-login" onclick="openLoginModal()">ENTRAR</button>
  </div>
</nav>

<div class="sub-nav">
  <a href="#" class="active" onclick="loadGames(); return false">Novedades</a>
  <a href="#" onclick="loadTopRated(); return false">Más valorados</a>
  <a href="#">PC</a><a href="#">PS5</a><a href="#">Xbox</a><a href="#">Switch</a>
</div>

<div class="page-wrap">
  <div class="two-col">
    <div>
      <div class="section-header"><h2>🎮 Juegos recientes</h2></div>
      <div id="gamesGrid" class="games-grid"><div class="loading">Cargando juegos...</div></div>
    </div>
    <div>
      <div class="sidebar-card">
        <div class="sidebar-card-header">🏆 TOP 10 COMUNIDAD</div>
        <div class="sidebar-card-body" id="topList"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <div class="modal-top"><h2 id="modalTitle">🔐 INICIAR SESIÓN</h2><button class="modal-close" onclick="closeLoginModal()">✕</button></div>
    <div class="modal-body">
      <div id="loginFields">
        <input type="text" id="loginUsername" placeholder="Nombre de usuario" autocomplete="off">
        <input type="text" id="loginPassword" placeholder="Código secreto" autocomplete="off">
      </div>
      <div id="recoverFields" style="display:none">
        <input type="text" id="recoverNick" placeholder="Nombre de usuario" autocomplete="off">
        <input type="text" id="recoverSecret" placeholder="Palabra secreta" autocomplete="off">
      </div>
      <div id="registerFields" style="display:none">
        <input type="text" id="registerPassword" placeholder="Contraseña" autocomplete="off">
        <input type="text" id="registerSecret" placeholder="Palabra secreta (ej: Roma)" autocomplete="off">
      </div>
      <button class="submit-btn" id="modalActionBtn">INICIAR SESIÓN</button>
      <button class="switch-btn" id="modalSwitchBtn">📝 ¿No tienes cuenta? Regístrate</button>
      <button class="switch-btn" id="modalRecoverBtn">🔑 ¿Olvidaste tu código?</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="reviewModal">
  <div class="modal">
    <div class="modal-top"><h2>🎯 VALORAR JUEGO</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-game-info" id="modalGameInfo"></div>
    <div class="modal-body">
      <div class="overall-box">
        <div class="overall-number" id="overallNum">—</div>
        <div class="overall-bar-wrap"><div class="overall-bar"><div class="overall-bar-fill" id="overallFill" style="width:0%"></div></div></div>
      </div>
      <div id="slidersContainer"></div>
      <textarea id="reviewText" rows="3" placeholder="Escribe tu reseña..."></textarea>
      <select id="recommendSelect"><option value="true">✅ Sí lo recomiendo</option><option value="false">❌ No lo recomiendo</option></select>
      <button class="submit-btn" onclick="submitReview()">📝 PUBLICAR VALORACIÓN</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hcfgdskjzaonelmimsho.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fkt2NkOU9mfsb5V6zUaIsQ__ytD_PRj';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const RAWG_KEY = '0f28a5bfdda4462489f37fbb908f5246';
const RAWG_BASE = 'https://api.rawg.io/api';

let currentUser = null;
let currentGame = null;
let modalMode = 'login';
let sliderValues = {};

const SLIDER_GROUPS = {
  gameplay: [
    { id: 'combate', label: '⚔️ Mecánicas de combate', val: 7 },
    { id: 'controles', label: '🎮 Controles / Responsividad', val: 7 },
    { id: 'curva', label: '📈 Curva de dificultad', val: 7 },
    { id: 'variedad', label: '🌀 Variedad de mecánicas', val: 7 }
  ],
  design: [
    { id: 'ia', label: '🧠 IA de enemigos', val: 7 },
    { id: 'jefes', label: '👑 Diseño de jefes', val: 7 },
    { id: 'niveles', label: '🗺️ Diseño de niveles', val: 7 },
    { id: 'dificultad', label: '⚖️ Equilibrio de dificultad', val: 7 }
  ],
  tech: [
    { id: 'graficos', label: '🎨 Calidad gráfica', val: 7 },
    { id: 'arte', label: '🖌️ Dirección artística', val: 7 },
    { id: 'rendimiento', label: '⚡ Rendimiento / FPS', val: 7 },
    { id: 'bugs', label: '🐛 Estabilidad / Bugs', val: 7 }
  ],
  audio: [
    { id: 'musica', label: '🎵 Banda sonora', val: 7 },
    { id: 'sfx', label: '🔊 Efectos de sonido', val: 7 },
    { id: 'historia', label: '📖 Historia / Guión', val: 7 },
    { id: 'lore', label: '🌍 Construcción del mundo', val: 7 }
  ],
  value: [
    { id: 'duracion', label: '⏱️ Duración / Contenido', val: 7 },
    { id: 'precio', label: '💰 Relación calidad/precio', val: 7 },
    { id: 'replay', label: '🔄 Rejugabilidad', val: 7 },
    { id: 'multi', label: '👥 Multijugador', val: 7 }
  ]
};

function renderAllSliders() {
  const container = document.getElementById('slidersContainer');
  container.innerHTML = '';
  for (const [groupName, sliders] of Object.entries(SLIDER_GROUPS)) {
    const block = document.createElement('div');
    block.className = 'slider-block';
    let title = '';
    if (groupName === 'gameplay') title = '🎮 JUGABILIDAD';
    else if (groupName === 'design') title = '🧠 IA Y DISEÑO';
    else if (groupName === 'tech') title = '⚙️ APARTADO TÉCNICO';
    else if (groupName === 'audio') title = '🎵 AUDIO Y NARRATIVA';
    else title = '💰 VALOR Y CONTENIDO';
    block.innerHTML = `<div class="slider-block-title">${title}</div>`;
    sliders.forEach(s => {
      sliderValues[s.id] = s.val;
      const item = document.createElement('div');
      item.className = 'slider-item';
      item.innerHTML = `
        <div class="slider-header"><span>${s.label}</span><span class="slider-value" id="val-${s.id}">${s.val}/10</span></div>
        <input type="range" min="0" max="10" step="1" value="${s.val}" oninput="updateSlider('${s.id}', this.value)">
      `;
      block.appendChild(item);
    });
    container.appendChild(block);
  }
  updateOverall();
}

function updateSlider(id, val) {
  sliderValues[id] = parseInt(val);
  document.getElementById(`val-${id}`).innerText = val + '/10';
  updateOverall();
}

function updateOverall() {
  const values = Object.values(sliderValues);
  if (!values.length) return;
  const avg = values.reduce((a,b) => a+b, 0) / values.length;
  const score = Math.round(avg * 10);
  document.getElementById('overallNum').innerText = score;
  document.getElementById('overallFill').style.width = score + '%';
  const color = score >= 75 ? '#6ac46a' : (score >= 50 ? '#ffbe00' : '#e84040');
  document.getElementById('overallFill').style.backgroundColor = color;
}

// ========== RAWG CON PROXY corsproxy.io ==========
async function fetchRAWG(url) {
  try {
    const proxyUrl = 'https://corsproxy.io/?';
    const finalUrl = proxyUrl + encodeURIComponent(url);
    console.log('Fetching:', finalUrl);
    const res = await fetch(finalUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    console.log('RAWG response:', data);
    return data;
  } catch(e) {
    console.error('RAWG error:', e);
    return { results: [] };
  }
}

async function loadGames() {
  document.getElementById('gamesGrid').innerHTML = '<div class="loading">Cargando juegos...</div>';
  const data = await fetchRAWG(`${RAWG_BASE}/games?key=${RAWG_KEY}&page_size=20&ordering=-released`);
  console.log('Games loaded:', data);
  renderGames(data.results || []);
  loadTopGames();
}

async function loadTopRated() {
  const data = await fetchRAWG(`${RAWG_BASE}/games?key=${RAWG_KEY}&page_size=20&ordering=-rating`);
  renderGames(data.results || []);
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const data = await fetchRAWG(`${RAWG_BASE}/games?key=${RAWG_KEY}&search=${encodeURIComponent(q)}&page_size=20`);
  renderGames(data.results || []);
}

function renderGames(games) {
  const grid = document.getElementById('gamesGrid');
  if (!games.length) { grid.innerHTML = '<div class="loading">No se encontraron juegos</div>'; return; }
  grid.innerHTML = games.map(game => `
    <div class="game-card" onclick="openGame(${game.id}, '${game.name.replace(/'/g, "\\'")}', '${game.background_image || ''}')">
      <img class="game-card-img" src="${game.background_image || 'https://via.placeholder.com/300x170?text=No+Image'}" alt="${game.name}">
      <div class="game-card-body">
        <div class="game-card-title">${game.name}</div>
        <div class="game-card-meta">${game.released?.slice(0,4) || ''}</div>
      </div>
      <div class="game-card-footer"><div>🎮</div><div class="score na" id="score-${game.id}">—</div></div>
    </div>
  `).join('');
  loadGamesAvg(games);
}

async function loadGamesAvg(games) {
  const { data } = await supabase.from('games_avg').select('*');
  if (data) {
    games.forEach(game => {
      const avg = data.find(a => a.game_id === game.id);
      const el = document.getElementById(`score-${game.id}`);
      if (el && avg && avg.avg_score) {
        const score = Math.round(avg.avg_score);
        el.className = `score ${score >= 75 ? 'green' : (score >= 50 ? 'yellow' : 'red')}`;
        el.innerText = score;
      }
    });
  }
}

async function loadTopGames() {
  const { data } = await supabase.from('games_avg').select('*').order('avg_score', { ascending: false }).limit(10);
  const container = document.getElementById('topList');
  if (!data || data.length === 0) { container.innerHTML = '<div class="list-item">Sin valoraciones aún</div>'; return; }
  container.innerHTML = data.map((g, i) => `
    <div class="list-item" onclick="fetchAndOpenGame(${g.game_id})">
      <span class="list-rank">${i+1}</span>
      <span class="list-title">${g.game_name}</span>
      <div class="score small ${g.avg_score >= 75 ? 'green' : (g.avg_score >= 50 ? 'yellow' : 'red')}">${Math.round(g.avg_score)}</div>
    </div>
  `).join('');
}

async function fetchAndOpenGame(gameId) {
  const data = await fetchRAWG(`${RAWG_BASE}/games/${gameId}?key=${RAWG_KEY}`);
  openGame(gameId, data.name, data.background_image || '');
}

async function openGame(gameId, gameName, gameImage) {
  currentGame = { id: gameId, name: gameName, image: gameImage };
  document.getElementById('modalGameInfo').innerHTML = `
    <img class="modal-game-img" src="${gameImage || 'https://via.placeholder.com/70x44'}" onerror="this.src='https://via.placeholder.com/70x44'">
    <div><div class="modal-game-title">${gameName}</div></div>
  `;
  for (const group of Object.values(SLIDER_GROUPS)) {
    for (const s of group) sliderValues[s.id] = 7;
  }
  renderAllSliders();
  document.getElementById('reviewModal').classList.add('open');
}

async function submitReview() {
  if (!currentUser) { alert('Inicia sesión primero'); closeModal(); openLoginModal(); return; }
  const reviewText = document.getElementById('reviewText').value.trim() || '';
  const recommend = document.getElementById('recommendSelect').value === 'tr
