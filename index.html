<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="autocomplete" content="off">
<title>CritiGames — Reviews reales de jugadores</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --white: #ffffff;
  --off-white: #f7f7f5;
  --gray-50: #f2f2f0;
  --gray-100: #e8e8e4;
  --gray-200: #d0d0cc;
  --gray-400: #909088;
  --gray-500: #6b6b66;
  --gray-700: #3a3a36;
  --gray-900: #1a1a18;
  --green: #6ac46a;
  --green-dark: #4a8c4a;
  --yellow: #ffbe00;
  --yellow-dark: #b88600;
  --red: #e84040;
  --red-dark: #a02828;
  --blue-accent: #1a6ef5;
  --border: #e0e0da;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
  --admin: #9333ea;
  --admin-dark: #6b21a8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--off-white);
  color: var(--gray-900);
  font-family: 'Roboto', sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

/* ─── GLOBAL BANNER ─── */
#globalBanner {
  display: none;
  background: var(--yellow);
  color: var(--gray-900);
  text-align: center;
  padding: .4rem 1rem;
  font-family: 'Roboto', sans-serif;
  font-weight: 700;
  font-size: .85rem;
  letter-spacing: .5px;
  position: relative;
}
#globalBanner.active { display: block; }
#globalBanner .banner-close {
  position: absolute; right: .75rem; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  font-size: 1rem; color: var(--gray-900); opacity: .6;
}

/* ─── NAV ─── */
nav {
  background: var(--gray-900);
  padding: 0 1rem;
  display: flex;
  align-items: center;
  gap: .75rem;
  height: 50px;
  position: sticky; top: 0; z-index: 100;
}
.nav-logo {
  font-family: 'Roboto', sans-serif;
  font-size: 1.4rem; font-weight: 800;
  letter-spacing: 1px; color: var(--white);
  text-decoration: none; white-space: nowrap; flex-shrink: 0;
}
.nav-logo span { color: var(--green); }
.nav-search {
  flex: 1 1 auto;
  min-width: 120px;
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 4px;
  overflow: hidden;
}
.nav-search input {
  flex: 1 1 auto;
  min-width: 60px;
  width: auto;
  background: none;
  border: none;
  outline: none;
  color: var(--white);
  font-family: 'Roboto', sans-serif;
  font-size: .85rem;
  padding: .45rem .6rem;
}
.nav-search input::placeholder {
  color: rgba(255,255,255,0.6);
  font-weight: 400;
}
.nav-search button {
  flex: 0 0 auto;
  background: var(--green);
  border: none;
  padding: .45rem .7rem;
  color: var(--gray-900);
  font-weight: 700;
  cursor: pointer;
  font-size: .75rem;
  font-family: 'Roboto', sans-serif;
  letter-spacing: .5px;
  white-space: nowrap;
}
.nav-links { display: flex; gap: 1rem; margin-left: auto; flex-shrink: 0; }
.nav-links a {
  color: rgba(255,255,255,.65);
  font-family: 'Roboto', sans-serif;
  font-size: .9rem;
  font-weight: 600;
  text-decoration: none;
  letter-spacing: .5px;
  white-space: nowrap;
  transition: color .15s;
}
.nav-links a:hover { color: var(--white); }
.nav-btn-login {
  background: none;
  border: 1px solid rgba(255,255,255,.4);
  color: var(--white);
  padding: .3rem .8rem;
  font-family: 'Roboto', sans-serif;
  font-weight: 600;
  font-size: .85rem;
  letter-spacing: .5px;
  cursor: pointer;
  white-space: nowrap;
  border-radius: 4px;
  transition: all .15s;
  flex-shrink: 0;
}
.nav-btn-login:hover { background: rgba(255,255,255,.15); }
.nav-user-menu { position: relative; flex-shrink: 0; }
.nav-user-btn {
  background: var(--green-dark);
  border: none;
  color: var(--white);
  padding: .3rem .8rem;
  font-family: 'Roboto', sans-serif;
  font-weight: 700;
  font-size: .85rem;
  letter-spacing: .5px;
  cursor: pointer;
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: .4rem;
  white-space: nowrap;
}
.nav-user-btn.admin-btn { background: var(--admin-dark); }
.nav-user-btn .crown { font-size: .75rem; }
.nav-dropdown {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  background: var(--white);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  min-width: 160px;
  z-index: 200;
  display: none;
  border-radius: 4px;
}
.nav-dropdown.open { display: block; }
.nav-dropdown a, .nav-dropdown button {
  display: block;
  width: 100%;
  text-align: left;
  padding: .6rem 1rem;
  border: none;
  background: none;
  font-family: 'Roboto', sans-serif;
  font-size: .85rem;
  font-weight: 600;
  color: var(--gray-700);
  cursor: pointer;
  text-decoration: none;
  transition: background .1s;
}
.nav-dropdown a:hover, .nav-dropdown button:hover { background: var(--gray-50); }
.nav-dropdown .sep { height: 1px; background: var(--border); margin: .25rem 0; }
.nav-dropdown .admin-link { color: var(--admin); }

/* ─── SUB-NAV ─── */
.sub-nav {
  background: var(--white);
  border-bottom: 2px solid var(--border);
  padding: 0 1rem;
  display: flex;
  align-items: center;
  gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.sub-nav::-webkit-scrollbar { display: none; }
.sub-nav a {
  font-family: 'Roboto', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--gray-500);
  text-decoration: none;
  padding: .7rem .9rem;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  transition: all .15s;
  cursor: pointer;
}
.sub-nav a:hover, .sub-nav a.active {
  color: var(--gray-900);
  border-bottom-color: var(--gray-900);
}

/* ─── LAYOUT ─── */
.page-wrap {
  width: 100%;
  max-width: 1140px;
  margin: 0 auto;
  padding: 0 1rem;
  overflow-x: hidden;
}
.section-header {
  padding: 1.25rem 0 .875rem;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.section-header h2 {
  font-family: 'Roboto', sans-serif;
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--gray-900);
}
.section-header a {
  font-family: 'Roboto', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  color: var(--blue-accent);
  text-decoration: none;
  letter-spacing: .5px;
  text-transform: uppercase;
  cursor: pointer;
}

/* ─── SCORE BADGE ─── */
.score {
  min-width: 46px;
  width: auto;
  height: 46px;
  padding: 0 6px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Roboto', sans-serif;
  font-size: 1.3rem;
  font-weight: 800;
  border-radius: 4px;
}
.score.small {
  min-width: 38px;
  height: 38px;
  padding: 0 4px;
  font-size: 0.9rem;
}
.score.na {
  background: var(--gray-100);
  color: var(--gray-500);
  font-size: 0.65rem;
  font-weight: 700;
  min-width: 38px;
}
.score.green  { background: var(--green);  color: var(--gray-900); }
.score.yellow { background: var(--yellow); color: var(--gray-900); }
.score.red    { background: var(--red);    color: var(--white); }

/* ─── GAME CARDS ─── */
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  overflow: hidden;
}
.game-card {
  background: var(--white);
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: box-shadow .15s;
  text-decoration: none;
  color: inherit;
}
.game-card:hover { box-shadow: inset 0 0 0 2px var(--gray-900); z-index: 1; }
.game-card-img {
  width: 100%;
  aspect-ratio: 16/9;
  max-height: 130px;
  object-fit: cover;
  background: var(--gray-100);
  display: block;
}
.game-card-img-placeholder {
  width: 100%;
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, #2a2a28, #3a3a36);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6b6b66;
  font-size: 2rem;
}
.game-card-body { padding: .65rem; flex: 1; display: flex; flex-direction: column; gap: .35rem; }
.platform-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: .5rem;
  font-weight: 600;
  padding: .12rem .35rem;
  background: var(--gray-50);
  border: 1px solid var(--border);
  color: var(--gray-500);
  border-radius: 2px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.game-card-platforms { display: flex; gap: .25rem; flex-wrap: wrap; }
.game-card-title {
  font-family: 'Roboto', sans-serif;
  font-size: .95rem;
  font-weight: 700;
  line-height: 1.2;
  color: var(--gray-900);
  word-break: break-word;
}
.game-card-meta {
  font-family: 'Roboto', sans-serif;
  font-size: .72rem;
  color: var(--gray-500);
  margin-top: auto;
}
.game-card-footer {
  padding: .55rem .65rem;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.game-card-footer-label {
  font-family: 'Roboto', sans-serif;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--gray-500);
}
.game-card-footer-sub {
  font-family: 'Roboto', sans-serif;
  font-size: .62rem;
  color: var(--gray-500);
  margin-top: .1rem;
}

/* ─── FEATURED ─── */
.featured-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  margin-bottom: 1.5rem;
  overflow: hidden;
}
.featured-card {
  background: var(--white);
  display: flex;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: box-shadow .15s;
  overflow: hidden;
}
.featured-card:hover { box-shadow: inset 0 0 0 2px var(--gray-900); z-index: 1; }
.featured-card-img {
  width: 140px;
  height: 100%;
  object-fit: cover;
  background: var(--gray-100);
  flex-shrink: 0;
}
.featured-card-img-placeholder {
  width: 140px;
  flex-shrink: 0;
  background: linear-gradient(135deg, #2a2a28, #3a3a36);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6b6b66;
  font-size: 2rem;
}
.featured-card-body { padding: .875rem; flex: 1; display: flex; flex-direction: column; gap: .35rem; }
.featured-card-label {
  font-family: 'Roboto', sans-serif;
  font-size: .62rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--green-dark);
}
.featured-card-title {
  font-family: 'Roboto', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1.1;
  color: var(--gray-900);
  word-break: break-word;
}
.featured-card-genre {
  font-family: 'Roboto', sans-serif;
  font-size: .72rem;
  color: var(--gray-500);
}
.featured-card-score-row { display: flex; align-items: center; gap: .5rem; margin-top: auto; padding-top: .4rem;  flex-wrap: wrap; }
.featured-card-score-info { display: flex; flex-direction: column; }
.featured-card-score-verdict { font-family: 'Roboto', sans-serif; font-size: .82rem; font-weight: 700; color: var(--gray-700); }
.featured-card-score-count { font-family: 'Roboto', sans-serif; font-size: .68rem; color: var(--gray-500); }

/* ─── SKELETONS ─── */
.skeleton { background: var(--white); animation: shimmer 1.4s ease-in-out infinite; }
.skeleton-img { width: 100%; aspect-ratio: 16/9; background: var(--gray-100); }
.skeleton-body { padding: .75rem; display: flex; flex-direction: column; gap: .5rem; }
.skeleton-line { height: 12px; border-radius: 2px; background: var(--gray-100); }
@keyframes shimmer { 0%,100% { opacity:1; } 50% { opacity:.6; } }

/* ─── TWO-COL ─── */
.two-col { display: grid; grid-template-columns: 1fr 280px; gap: 1.25rem; align-items: start; }

/* ─── LIST VIEW ─── */
.list-view { border: 1px solid var(--border); background: var(--white); }
.list-item {
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .65rem .875rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
  text-decoration: none;
  color: inherit;
}
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: var(--gray-50); }
.list-rank {
  font-family: 'Roboto', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  color: var(--gray-200);
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}
.list-img { width: 52px; height: 33px; object-fit: cover; flex-shrink: 0; background: var(--gray-100); }
.list-img-ph {
  width: 52px;
  height: 33px;
  flex-shrink: 0;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gray-200);
  font-size: 1rem;
}
.list-info { flex: 1; min-width: 0; }
.list-title {
  font-family: 'Roboto', sans-serif;
  font-weight: 700;
  font-size: .9rem;
  line-height: 1.1;
  color: var(--gray-900);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.list-meta { font-family: 'Roboto', sans-serif; font-size: .68rem; color: var(--gray-500); }

/* ─── SIDEBAR CARD ─── */
.sidebar-card { background: var(--white); border: 1px solid var(--border); margin-bottom: 1rem; border-radius: 4px; overflow: hidden; }
.sidebar-card-header {
  padding: .65rem .875rem;
  border-bottom: 1px solid var(--border);
  font-family: 'Roboto', sans-serif;
  font-size: .88rem;
  font-weight: 800;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--gray-900);
}
.sidebar-card-body { padding: .65rem .875rem; }
.genre-list { display: flex; flex-wrap: wrap; gap: .35rem; }
.genre-chip {
  font-family: 'Roboto', sans-serif;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .5px;
  padding: .25rem .55rem;
  background: var(--gray-50);
  border: 1px solid var(--border);
  color: var(--gray-700);
  cursor: pointer;
  border-radius: 2px;
  transition: all .15s;
  text-decoration: none;
}
.genre-chip:hover { background: var(--gray-900); color: var(--white); border-color: var(--gray-900); }

/* ─── COMMUNITY BANNER ─── */
.community-banner {
  background: var(--gray-900);
  color: var(--white);
  padding: 1.1rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 1.2rem;
  border: 1px solid var(--border);
  margin-bottom: 1.25rem;
  border-radius: 4px;
  flex-wrap: wrap;
}
.community-banner-icon { font-size: 1.75rem; flex-shrink: 0; }
.community-banner-text h3 {
  font-family: 'Roboto', sans-serif;
  font-size: 1.05rem;
  font-weight: 800;
  letter-spacing: .5px;
  margin-bottom: .2rem;
}
.community-banner-text p {
  font-size: .78rem;
  color: rgba(255,255,255,.65);
  font-family: 'Roboto', sans-serif;
}
.community-banner-btn {
  margin-left: auto;
  flex-shrink: 0;
  background: var(--green);
  color: var(--gray-900);
  border: none;
  padding: .5rem 1.1rem;
  font-family: 'Roboto', sans-serif;
  font-weight: 800;
  font-size: .88rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 4px;
  transition: opacity .15s;
}
.community-banner-btn:hover { opacity: .85; }

/* ─── SCORE LEGEND ─── */
.score-legend {
  display: flex;
  gap: .875rem;
  align-items: center;
  flex-wrap: wrap;
  padding: .5rem 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: .875rem;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: .35rem;
  font-family: 'Roboto', sans-serif;
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: .3px;
}
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }

/* ─── FOOTER ─── */
footer {
  background: var(--gray-900);
  color: rgba(255,255,255,.5);
  text-align: center;
  padding: 2rem 1.5rem;
  margin-top: 3rem;
  font-family: 'Roboto', sans-serif;
  font-size: .8rem;
  letter-spacing: .5px;
}
footer strong { color: var(--green); }

/* ─── MODAL BASE ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: .75rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--white);
  width: 100%;
  max-width: 900px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
  transform: translateY(16px);
  transition: transform .2s;
  border-radius: 8px;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-top {
  background: var(--gray-900);
  padding: .875rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 1;
  border-radius: 8px 8px 0 0;
}
.modal-top h2 {
  font-family: 'Roboto', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--white);
}
.modal-close {
  background: none;
  border: 1px solid rgba(255,255,255,.3);
  color: var(--white);
  cursor: pointer;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  border-radius: 4px;
  flex-shrink: 0;
}
.modal-close:hover { background: rgba(255,255,255,.1); }

/* ─── GAME MODAL TABS ─── */
.game-modal-tabs {
  display: flex;
  border-bottom: 2px solid var(--border);
  background: var(--white);
}
.game-tab {
  flex: 1;
  padding: .75rem 1rem;
  background: none;
  border: none;
  font-family: 'Roboto', sans-serif;
  font-size: .9rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--gray-500);
  cursor: pointer;
  transition: all .15s;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
}
.game-tab.active {
  color: var(--gray-900);
  border-bottom-color: var(--gray-900);
}
.modal-game-info {
  display: flex;
  gap: .65rem;
  padding: .875rem 1.25rem;
  background: var(--gray-50);
  border-bottom: 1px solid var(--border);
  align-items: center;
}
.modal-game-img {
  width: 72px;
  height: 45px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--gray-100);
  border-radius: 4px;
}
.modal-game-title { font-family: 'Roboto', sans-serif; font-size: 1.05rem; font-weight: 800; }
.modal-game-meta { font-family: 'Roboto', sans-serif; font-size: .72rem; color: var(--gray-500); }
.modal-body { padding: 1.25rem; }

/* ─── REVIEWS GRID ─── */
.reviews-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
.review-card {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 1rem;
  transition: box-shadow .15s;
  border-radius: 4px;
}
.review-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .5rem;
  margin-bottom: .65rem;
  padding-bottom: .65rem;
  border-bottom: 1px solid var(--border);
}
.review-author-info {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-wrap: wrap;
}
.review-author-name {
  font-family: 'Roboto', sans-serif;
  font-weight: 800;
  font-size: .9rem;
  color: var(--gray-900);
}
.review-author-name.is-admin { color: var(--admin); }
.review-author-name.is-admin::after { content: ' 👑'; font-size: .7rem; }
.review-date {
  font-family: 'Roboto', sans-serif;
  font-size: .68rem;
  color: var(--gray-500);
}
.review-platform-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: .55rem;
  padding: .12rem .4rem;
  background: var(--gray-50);
  border: 1px solid var(--border);
  color: var(--gray-500);
  border-radius: 2px;
  text-transform: uppercase;
}
.review-score-large {
  font-family: 'Roboto', sans-serif;
  font-weight: 800;
  font-size: 1.8rem;
  line-height: 1;
  padding: .25rem .6rem;
  border-radius: 4px;
  display: inline-block;
}
.review-score-large.green { background: var(--green); color: var(--gray-900); }
.review-score-large.yellow { background: var(--yellow); color: var(--gray-900); }
.review-score-large.red { background: var(--red); color: var(--white); }
.review-recommend {
  font-family: 'Roboto', sans-serif;
  font-size: .7rem;
  font-weight: 700;
  margin-left: .5rem;
}
